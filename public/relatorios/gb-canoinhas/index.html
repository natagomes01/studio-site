<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Atendimento por IA · Gracie Barra Canoinhas | Albatroz Studio</title>
<meta name="description" content="Relatório de atendimento por IA no WhatsApp: Gracie Barra Canoinhas, academia de jiu-jitsu em Canoinhas, Santa Catarina. Pessoas atendidas, horários e origem.">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="../assets/colors_and_type.css">
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 72px; }
  body { margin: 0; background: var(--bg-page); }
  [hidden] { display: none !important; }
  .wrap { max-width: 1120px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
  p { max-width: 68ch; }
  .num { font-variant-numeric: tabular-nums; }

  /* nav */
  .top-stripe { position: fixed; top: 0; left: 0; right: 0; height: 7px; background: var(--c-accent-500); z-index: 100; }
  nav.main-nav { position: sticky; top: 7px; z-index: 90; background: var(--bg-page); border-bottom: 1px solid var(--border-quiet); }
  .nav-inner { display: flex; align-items: center; gap: 24px; padding-block: 14px; }
  .nav-inner img { height: 22px; width: auto; }
  .nav-links { display: flex; gap: 20px; margin-left: auto; }
  .nav-links a { font-weight: 700; font-size: 11px; letter-spacing: var(--ls-caps); text-transform: uppercase; color: var(--fg-muted); }
  .nav-links a:hover { color: var(--c-accent-500); opacity: 1; }
  .lang { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12px; letter-spacing: var(--ls-caps); margin-left: 8px; }
  .lang button { font: inherit; letter-spacing: inherit; background: none; border: 0; padding: 4px 2px; cursor: pointer; color: var(--fg-quiet); }
  .lang button[aria-pressed="true"] { color: var(--fg-strong); border-bottom: 2px solid var(--c-accent-500); }
  .lang span { color: var(--fg-quiet); }
  @media (max-width: 820px) { .nav-links { display: none; } .lang { margin-left: auto; } }

  /* hero */
  .hero { padding: 80px 0 56px; }
  .hero .eyebrow { display: block; margin: 0 0 20px; }
  .hero h1 { margin: 0 0 24px; font-size: clamp(38px, 6vw, 76px); text-wrap: balance; }
  .hero .lead { margin: 0 0 36px; max-width: 60ch; }
  .rule--accent { display: block; margin: 0 0 36px; }
  .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 20px 32px; border-top: 1px solid var(--border-quiet); padding-top: 24px; margin: 0; }
  .meta-grid dt { font-weight: 700; font-size: 11px; letter-spacing: var(--ls-caps); text-transform: uppercase; color: var(--fg-muted); margin: 0 0 4px; }
  .meta-grid dd { margin: 0; font-size: 15px; color: var(--fg-strong); }

  /* KPI band */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1px; background: var(--border-quiet); border: 1px solid var(--border-quiet); }
  .kpi { background: var(--bg-card); padding: 26px 24px 24px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .kpi .lbl { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; font-weight: 700; font-size: 11px; letter-spacing: var(--ls-caps); text-transform: uppercase; color: var(--fg-muted); line-height: 1.4; }
  .kpi .val { font-family: var(--font-headline); font-size: clamp(40px, 4.4vw, 56px); line-height: 1; color: var(--fg-strong); font-variant-numeric: tabular-nums; }
  .kpi.accent .val { color: var(--c-accent-500); }
  .kpi .sub { font-size: 13.5px; color: var(--fg-muted); line-height: 1.45; }

  /* info tooltips */
  .info { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid currentColor; background: none; color: var(--fg-muted); font: 700 11px/1 var(--font-highlight); font-style: italic; cursor: help; display: inline-grid; place-items: center; padding: 0; vertical-align: middle; }
  .info:hover, .info:focus-visible, .info[aria-expanded="true"] { color: var(--c-accent-500); outline: none; }
  .info:focus-visible { box-shadow: 0 0 0 3px rgba(240,69,0,.25); }
  .pop { position: absolute; z-index: 200; max-width: min(340px, calc(100vw - 32px)); background: var(--c-charcoal); color: var(--c-offwhite); padding: 14px 16px; font-size: 13.5px; line-height: 1.55; box-shadow: var(--shadow-drop); }
  .pop .pop-h { display: block; font-weight: 700; font-size: 10.5px; letter-spacing: var(--ls-caps); text-transform: uppercase; color: var(--c-accent-400); margin-bottom: 6px; }
  .tip { position: absolute; z-index: 150; pointer-events: none; background: var(--bg-card); border: 1px solid var(--c-charcoal); padding: 8px 12px; font-size: 13px; line-height: 1.5; white-space: nowrap; font-variant-numeric: tabular-nums; box-shadow: var(--shadow-drop); }
  .tip b { display: block; font-weight: 700; font-size: 10.5px; letter-spacing: var(--ls-caps); text-transform: uppercase; color: var(--fg-muted); margin-bottom: 2px; }

  /* sections */
  section { padding: var(--space-xl) 0; border-top: 1px solid var(--border-quiet); }
  section.first { border-top: 0; padding-top: 0; }
  .section-head { max-width: 66ch; margin: 0 0 var(--space-m); }
  .section-head .eyebrow { display: block; margin: 0 0 var(--space-xs); }
  .section-head h2 { margin: 0 0 var(--space-xs); text-wrap: balance; }
  .section-head .lead { margin: 0; font-size: 18px; }
  #breakdowns { grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 24px; margin-top: 24px; }
  .card { background: var(--bg-card); border: 1px solid var(--border-quiet); padding: 26px 26px 22px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .card h3 { font-size: 19px; margin: 0; display: flex; align-items: center; gap: 10px; }
  .card .note { font-size: 13.5px; color: var(--fg-muted); margin: 0; }
  .chart { position: relative; width: 100%; min-height: 120px; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { font-family: var(--font-body); font-size: 12px; fill: var(--fg-muted); }
  .chart text.strong { fill: var(--fg-strong); font-weight: 600; }
  .chart text.end { fill: var(--fg-strong); font-weight: 700; }
  .stats { font-size: 13.5px; color: var(--fg-muted); margin: 0; font-variant-numeric: tabular-nums; }

  .seg { display: inline-flex; border: 1.5px solid var(--c-charcoal); }
  .seg button { font: 700 11px/1 var(--font-body); letter-spacing: var(--ls-caps); text-transform: uppercase; padding: 9px 12px; background: none; border: 0; color: var(--fg-strong); cursor: pointer; }
  .seg button + button { border-left: 1.5px solid var(--c-charcoal); }
  .seg button[aria-pressed="true"] { background: var(--c-charcoal); color: var(--c-offwhite); }
  .seg button:focus-visible { outline: 2px solid var(--c-accent-500); outline-offset: 2px; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; list-style: none; margin: 0; padding: 0; font-size: 12.5px; color: var(--fg-muted); }
  .legend i { display: inline-block; width: 11px; height: 11px; margin-right: 6px; vertical-align: -1px; }
  .legend i.ramp { width: 56px; background: linear-gradient(90deg, #ECE6DA, #BEBEBD 30%, #696858 70%, #202020); }
  .legend i.box { border: 2px dashed var(--c-accent-500); background: none; }

  .explain { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 24px 40px; margin-top: 32px; }
  .explain h4 { font-family: var(--font-highlight); font-size: 18px; margin: 0 0 8px; color: var(--fg-strong); }
  .explain p { font-size: 15px; margin: 0; color: var(--fg-default); }
  .explain .bar-accent { width: 40px; height: 3px; background: var(--c-accent-500); margin-bottom: 14px; }

  table.data { width: 100%; border-collapse: collapse; font-size: 14.5px; font-variant-numeric: tabular-nums; }
  table.data th, table.data td { padding: 12px 10px; border-bottom: 1px solid var(--border-quiet); text-align: left; }
  table.data thead th { font-weight: 700; font-size: 11px; letter-spacing: var(--ls-caps); text-transform: uppercase; color: var(--fg-muted); border-bottom: 2px solid var(--c-charcoal); }
  table.data td.r, table.data th.r { text-align: right; }
  table.data tr.used td { font-weight: 700; color: var(--fg-strong); }
  table.data tr.used td:first-child::after { content: ""; display: inline-block; width: 8px; height: 8px; background: var(--c-accent-500); margin-left: 8px; vertical-align: 1px; }
  .table-wrap { overflow-x: auto; }

  dl.glossary { display: grid; grid-template-columns: minmax(140px, 220px) 1fr; gap: 0; margin: 0; border-top: 2px solid var(--c-charcoal); }
  dl.glossary dt, dl.glossary dd { padding: 16px 0; border-bottom: 1px solid var(--border-quiet); margin: 0; }
  dl.glossary dt { font-weight: 700; color: var(--fg-strong); padding-right: 24px; }
  dl.glossary dd { color: var(--fg-default); font-size: 15px; line-height: 1.6; max-width: 70ch; }
  @media (max-width: 640px) { dl.glossary { grid-template-columns: 1fr; } dl.glossary dt { border-bottom: 0; padding-bottom: 2px; } dl.glossary dd { padding-top: 0; } }

  footer.brand-footer { background: var(--c-army); color: var(--c-offwhite); padding: 64px 0 36px; }
  footer.brand-footer img { height: 34px; margin-bottom: 20px; }
  footer.brand-footer p { color: #D8D6C9; font-size: 14.5px; margin: 0 0 28px; max-width: 56ch; }
  footer.brand-footer .fine { font-size: 12px; color: #C3C0AA; border-top: 1px solid rgba(242,237,228,.2); padding-top: 18px; margin: 0; max-width: none; }

  .loading { color: var(--fg-muted); font-size: 14px; padding: 40px 0; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>

<script>
(() => {
  const VIVID = ['#F04500', '#2563EB', '#F2B705', '#696858', '#0E9F6E', '#5F6870'];
  const C = { army: '#696858', slate: '#5F6870', orange: '#F04500', khaki: '#989880', sage: '#BEBEBD', slate3: '#A0ACB4', charcoal: '#202020' };
  let D = null, lang = 'pt', gran = 'week';

  // ---------- formatting ----------
  const loc = () => (lang === 'pt' ? 'pt-BR' : 'en-US');
  const N = (x) => new Intl.NumberFormat(loc()).format(Math.round(x));
  const P = (x) => new Intl.NumberFormat(loc(), { style: 'percent', maximumFractionDigits: 0 }).format(x);
  const P1 = (x) => new Intl.NumberFormat(loc(), { style: 'percent', minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(x);
  const toDate = (s) => new Date((s.length === 4 ? s + '-01-01' : s.length === 7 ? s + '-01' : s) + 'T12:00:00Z');
  const DF = (s, o) => new Intl.DateTimeFormat(loc(), { timeZone: 'UTC', ...o }).format(toDate(s));
  const DL = (s) => DF(s, { day: 'numeric', month: 'short', year: 'numeric' });
  const hourPt = (h) => `${h}h`, hourEn = (h) => `${h % 12 === 0 ? 12 : h % 12} ${h < 12 ? 'am' : 'pm'}`;
  const HR = (h) => (lang === 'pt' ? hourPt(h) : hourEn(h));
  const WD = { pt: ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'], en: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'] };
  const WDs = { pt: ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'], en: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'] };
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const MY = (s) => DF(s, { month: 'short', year: 'numeric' });
  const ML = (s) => DF(s, { month: 'long', year: 'numeric' });
  const noun = (l) => D.client.place[l].split(' ').slice(1).join(' ');

  // ---------- derived values ----------
  function V() {
    const t = D.totals, heatTot = D.heat.flat().reduce((a, b) => a + b, 0);
    let hpeak = { wd: 0, h: 0, n: -1 };
    D.heat.forEach((row, wd) => row.forEach((n, h) => { if (n > hpeak.n) hpeak = { wd, h, n }; }));
    const wdTot = D.heat.map((r) => r.reduce((a, b) => a + b, 0));
    const topWd = wdTot.indexOf(Math.max(...wdTot));
    const gap = Object.fromEntries(D.gaps.map((g) => [g.k, g.n]));
    return { ...t, ...D.typical, heatTot, hpeak, wdTot, topWd, gap,
      closedShare: t.closed / t.conversations, followShare: t.followed_people / t.people,
      retShare: t.returners / t.people, unclear: gap['1_7d'],
      first: D.range[0], last: D.range[1] };
  }

  // ---------- copy ----------
  const T = {
    pt: {
      nav_volume: 'Volume', nav_when: 'Horários', nav_return: 'Retorno', nav_origin: 'Origem', nav_method: 'Método',
      eyebrow: () => `Relatório de atendimento por IA · ${D.client.name}, ${D.client.city.pt}`,
      h1: (v) => `${N(v.people)} pessoas atendidas pela IA`,
      lead: (v) => `Entre ${DL(v.first)} e ${DL(v.last)}, a IA da Albatroz respondeu o WhatsApp ${D.client.of.pt}, ${D.client.desc.pt}. ${P(v.closedShare)} das conversas começaram com ${D.client.place.pt} fechada: à noite, de madrugada ou no domingo.`,
      m_period: 'Período', m_period_v: (v) => `${DL(v.first)} a ${DL(v.last)}, ${v.months} meses`,
      m_tz: 'Fuso horário', m_tz_v: 'São Paulo (UTC−3)',
      m_source: 'Fonte', m_source_v: (v) => `Exportação da plataforma de atendimento, ${N(v.threads)} registros`,
      m_updated: 'Atualizado em', m_updated_v: () => DL(D.generated.slice(0, 10)),

      k_people: 'Pessoas atendidas', k_people_v: (v) => N(v.people), k_people_s: (v) => `${N(v.conversations)} conversas, ${N(v.threads)} registros`,

  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const txt = (parent, x, y, s, attrs = {}) => { const e = el('text', { x, y, ...attrs }, parent); e.textContent = s; return e; };
  function svgFor(box, h) {
    box.replaceChildren();
    const w = Math.max(280, Math.floor(box.clientWidth));
    const s = el('svg', { viewBox: `0 0 ${w} ${h}`, role: 'img' }, box);
    return { s, w };
  }
  // off-white -> sage -> army -> charcoal, linear in value
  const STOPS = [[0, [236, 230, 218]], [0.3, [190, 190, 189]], [0.7, [105, 104, 88]], [1, [32, 32, 32]]];
  const ramp = (f) => {
    f = Math.max(0, Math.min(1, f));
    for (let i = 1; i < STOPS.length; i++) if (f <= STOPS[i][0]) {
      const [a, ca] = STOPS[i - 1], [b, cb] = STOPS[i], k = (f - a) / (b - a);
      return `rgb(${ca.map((c, j) => Math.round(c + (cb[j] - c) * k)).join(',')})`;
    }
    return 'rgb(32,32,32)';
  };
  const measure = (s, strings, cls) => { const g = el('g', {}, s); let m = 0; for (const x of strings) m = Math.max(m, txt(g, 0, 0, x, cls ? { class: cls } : {}).getComputedTextLength()); g.remove(); return m; };
  const niceMax = (v) => { const p = Math.pow(10, Math.floor(Math.log10(v || 1))); const f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; };

  const tipEl = document.getElementById('tip');
  function showTip(e, title, lines) {
    tipEl.replaceChildren();
    const b = document.createElement('b'); b.textContent = title; tipEl.appendChild(b);
    for (const l of lines) { const d = document.createElement('div'); d.textContent = l; tipEl.appendChild(d); }
    tipEl.hidden = false;
    const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    let x = e.pageX + 14, y = e.pageY - h - 12;
    if (x + w > window.scrollX + document.documentElement.clientWidth - 8) x = e.pageX - w - 14;
    if (y < window.scrollY + 70) y = e.pageY + 18;
    tipEl.style.left = Math.max(8, x) + 'px'; tipEl.style.top = y + 'px';
  }
  const hideTip = () => { tipEl.hidden = true; };
  const hover = (node, title, lines) => { node.addEventListener('pointermove', (e) => showTip(e, title, lines)); node.addEventListener('pointerleave', hideTip); };

  function vbars(box, rows, o) {
    const H = 300, top = 22, bottom = 28;
    const { s, w } = svgFor(box, H);
    const max = niceMax(Math.max(...rows.map((r) => Math.max(o.value(r), o.ghost ? o.ghost(r) : 0))));
    const ticks = [0, max / 4, max / 2, (3 * max) / 4, max];
    const ml = measure(s, ticks.map(N)) + 10, plotW = w - ml - 4;
    const y = (v) => H - bottom - (v / max) * (H - bottom - top);
    for (const tk of ticks) {
      el('line', { x1: ml, x2: w - 4, y1: y(tk), y2: y(tk), stroke: tk === 0 ? C.charcoal : 'rgba(32,32,32,.10)', 'stroke-width': 1 }, s);
      txt(s, ml - 8, y(tk) + 4, N(tk), { 'text-anchor': 'end' });
    }
    const step = plotW / rows.length, bw = Math.min(step * (rows.length > 60 ? 0.75 : 0.68), 64);
    const every = Math.ceil(rows.length / Math.max(2, Math.floor(plotW / 70)));
    rows.forEach((r, i) => {
      const cx = ml + step * i + step / 2, v = o.value(r);
      if (o.ghost) {
        const gv = o.ghost(r);
        el('rect', { x: cx - bw / 2, y: y(gv), width: bw, height: y(0) - y(gv), fill: 'none', stroke: C.slate, 'stroke-dasharray': '5 4', 'stroke-width': 1.5 }, s);
        txt(s, cx, y(gv) - 8, `${t('proj_lbl')}: ${N(gv)}`, { 'text-anchor': 'middle' });
      }
      el('rect', { x: cx - bw / 2, y: y(v), width: bw, height: Math.max(0, y(0) - y(v)), fill: o.color ? o.color(r) : C.army, 'fill-opacity': r.partial && !o.ghost ? 0.4 : 1 }, s);
      if (o.ghost) txt(s, cx, y(v) + 20, N(v), { 'text-anchor': 'middle', fill: '#F2EDE4', style: 'fill:#F2EDE4;font-weight:700' });
      if (i % every === 0) txt(s, cx, H - 8, o.label(r), { 'text-anchor': 'middle' });
      const hit = el('rect', { x: ml + step * i, y: top, width: step, height: H - bottom - top, fill: 'transparent' }, s);
      hover(hit, o.tipTitle(r), o.tipLines(r));
    });
  }

  function hbars(box, rows, o) {
    const probe = svgFor(box, 10);
    const labW = measure(probe.s, rows.map(o.label), 'strong'), ew = measure(probe.s, rows.map(o.end), 'end') + 10;
    const stacked = labW + 14 > probe.w * 0.42;
    const rowH = stacked ? 48 : 34, H = rows.length * rowH;
    const { s, w } = svgFor(box, H);
    const lw = stacked ? 0 : labW + 14;
    const max = Math.max(...rows.map(o.value)) || 1;
    const bwMax = Math.max(20, w - lw - ew);
    rows.forEach((r, i) => {
      const y0 = i * rowH, bw = (o.value(r) / max) * bwMax;
      const by = stacked ? y0 + 22 : y0 + 8, bh = stacked ? 16 : rowH - 16;
      txt(s, 0, stacked ? y0 + 15 : y0 + rowH / 2 + 4, o.label(r), { class: 'strong' });
      el('rect', { x: lw, y: by, width: Math.max(2, bw), height: bh, fill: o.color ? o.color(r, i) : C.army }, s);
      txt(s, lw + bw + 8, by + bh / 2 + 4, o.end(r), { class: 'end' });
      const hit = el('rect', { x: 0, y: y0, width: w, height: rowH, fill: 'transparent' }, s);
      hover(hit, o.label(r), o.tip(r));
    });
  }

  // ---------- charts ----------
  function drawVolume() {
    const rows = D.series[gran];
    const lbl = (r) => gran === 'day' || gran === 'week' ? DF(r.p, { day: 'numeric', month: 'short' }) : gran === 'month' ? DF(r.p, { month: 'short' }) : r.p;
    const title = (r) => gran === 'day' ? DF(r.p, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }) : gran === 'week' ? t('t_week', r.p) : gran === 'month' ? cap(DF(r.p, { month: 'long', year: 'numeric' })) : r.p;
    const proj = (r) => Math.round((r.people / r.days) * 365);
    vbars(document.getElementById('c-volume'), rows, {
      value: (r) => r.people, label: lbl, ghost: gran === 'year' ? proj : null,
      tipTitle: title,
      tipLines: (r) => {
        const l = [`${N(r.people)} ${t('t_people')}`, `${N(r.new)} ${t('t_new')}`];
        if (gran === 'year') l.push(t('t_proj', proj(r))); else if (r.partial) l.push(t('t_partial', r.days));
        return l;
      },
    });
    const full = rows.filter((r) => !r.partial), base = full.length ? full : rows;
    const best = rows.reduce((a, b) => (b.people > a.people ? b : a));
    document.getElementById('vol-stats').textContent = gran === 'year'
      ? t('stats_year', best.people, best.days, best.p)
      : t('stats', base.reduce((a, r) => a + r.people, 0) / base.length, title(best), best.people);
  }

  function drawHeat() {
    const box = document.getElementById('c-heat');
    const order = [1, 2, 3, 4, 5, 6, 0], cellH = 30, top = 22;
    const H = top + 7 * cellH;
    const { s, w } = svgFor(box, H);
    const ml = measure(s, WDs[lang], 'strong') + 12, cw = (w - ml) / 24;
    const max = Math.max(...D.heat.flat()), min = Math.min(...D.heat.flat());
    const every = cw < 20 ? 3 : cw < 34 ? 2 : 1;
    for (let h = 0; h < 24; h += every) txt(s, ml + h * cw + cw / 2, 13, lang === 'pt' ? `${h}h` : hourEn(h).replace(' ', ''), { 'text-anchor': 'middle' });
    order.forEach((wd, i) => {
      txt(s, 0, top + i * cellH + cellH / 2 + 4, WDs[lang][wd], { class: 'strong' });
      for (let h = 0; h < 24; h++) {
        const n = D.heat[wd][h];
        const r = el('rect', { x: ml + h * cw + 1, y: top + i * cellH + 1, width: Math.max(1, cw - 2), height: cellH - 2, fill: ramp((n - min) / (max - min || 1)) }, s);
        const open = (wd >= 1 && wd <= 5 && h >= 9 && h < 18) || (wd === 6 && h >= 9 && h < 13);
        hover(r, lang === 'pt' ? `${cap(WD.pt[wd])}, das ${hourPt(h)} às ${hourPt((h + 1) % 24)}` : `${WD.en[wd]}, ${hourEn(h)} to ${hourEn((h + 1) % 24)}`, [`${N(n)} ${t('t_convs')}`, open ? t('leg_open') : t('closed_h')]);
      }
    });
    const box1 = (a, b, r0, r1) => el('rect', { x: ml + a * cw, y: top + r0 * cellH, width: (b - a) * cw, height: (r1 - r0 + 1) * cellH, fill: 'none', stroke: C.orange, 'stroke-width': 2.5, 'stroke-dasharray': '6 3', 'pointer-events': 'none' }, s);
    box1(9, 18, 0, 4); box1(9, 13, 5, 5);
  }

  function drawClosed() {
    const tot = D.totals.conversations;
    hbars(document.getElementById('c-closed'), D.closed, {
      label: (r) => t('b_' + r.k), value: (r) => r.n, end: (r) => `${N(r.n)} · ${P(r.n / tot)}`,
      color: () => C.orange, tip: (r) => [`${N(r.n)} ${t('t_convs')}`, P1(r.n / tot)],
    });
  }

  function drawWeekday() {
    const v = V(), order = [1, 2, 3, 4, 5, 6, 0];
    hbars(document.getElementById('c-weekday'), order.map((wd) => ({ wd, n: v.wdTot[wd] })), {
      label: (r) => cap(WD[lang][r.wd]), value: (r) => r.n, end: (r) => N(r.n),
      color: (r) => (r.wd === v.topWd ? C.orange : C.army), tip: (r) => [`${N(r.n)} ${t('t_convs')}`, P1(r.n / v.heatTot)],
    });
  }

  function drawGaps() {
    const col = { split: C.sage, unclear: C.slate3, return: C.orange };
    hbars(document.getElementById('c-gaps'), D.gaps, {
      label: (r) => t('gp_' + r.k), value: (r) => r.n, end: (r) => N(r.n),
      color: (r) => col[r.kind], tip: (r) => [`${N(r.n)} ${t('t_pairs')}`, t('leg_' + r.kind)],
    });
  }

  function drawSens() {
    const tb = document.getElementById('sens-body'), tt = D.totals;
    tb.replaceChildren();
    [[1, tt.returners_1d], [7, tt.returners], [30, tt.returners_30d]].forEach(([d, n]) => {
      const tr = document.createElement('tr'); if (d === 7) tr.className = 'used';
      for (const [v, r] of [[t('sens_d', d), false], [N(n), true], [P1(n / tt.people), true]]) { const td = document.createElement('td'); td.textContent = v; if (r) td.className = 'r'; tr.appendChild(td); }
      tb.appendChild(tr);
    });
  }

  function drawCamp() {
    const box = document.getElementById('c-camp'), rows = D.campaigns;
    const keys = ['thread_lift', 'hifu', 'promo', 'organic'], col = VIVID.slice(0, 4);
    const H = 300, top = 14, bottom = 28;
    const { s, w } = svgFor(box, H);
    const tot = (r) => keys.reduce((a, k) => a + r[k], 0);
    const max = niceMax(Math.max(...rows.map(tot)));
    const ticks = [0, max / 4, max / 2, (3 * max) / 4, max];
    const ml = measure(s, ticks.map(N)) + 10, plotW = w - ml - 4;
    const y = (v) => H - bottom - (v / max) * (H - bottom - top);
    for (const tk of ticks) { el('line', { x1: ml, x2: w - 4, y1: y(tk), y2: y(tk), stroke: tk === 0 ? C.charcoal : 'rgba(32,32,32,.10)' }, s); txt(s, ml - 8, y(tk) + 4, N(tk), { 'text-anchor': 'end' }); }
    const step = plotW / rows.length, bw = Math.min(step * 0.62, 48);
    rows.forEach((r, i) => {
      const cx = ml + step * i + step / 2; let acc = 0;
      keys.forEach((k, j) => { el('rect', { x: cx - bw / 2, y: y(acc + r[k]), width: bw, height: y(acc) - y(acc + r[k]), fill: col[j] }, s); acc += r[k]; });
      txt(s, cx, H - 8, DF(r.m, { month: 'short' }), { 'text-anchor': 'middle' });
      const hit = el('rect', { x: ml + step * i, y: top, width: step, height: H - bottom - top, fill: 'transparent' }, s);
      hover(hit, cap(DF(r.m, { month: 'long', year: 'numeric' })), [`${N(tot(r))} ${t('t_total')}`, ...keys.map((k) => `${t('c_' + k)}: ${N(r[k])}`)]);
    });
  }

  function drawSpan() {
    const tot = D.span.reduce((a, r) => a + r.n, 0);
    hbars(document.getElementById('c-span'), D.span, { label: (r) => t('sp_' + r.k), value: (r) => r.n, end: (r) => P(r.n / tot), tip: (r) => [`${N(r.n)} ${t('t_convs')}`] });
  }
  function drawGeo() {
    const tot = D.geo.reduce((a, r) => a + r.n, 0);
    hbars(document.getElementById('c-geo'), D.geo, { label: (r) => r.label[lang], value: (r) => r.n, end: (r) => P(r.n / tot), color: (r, i) => (i === 0 ? C.army : C.khaki), tip: (r) => [`${N(r.n)} ${t('t_people')}`] });
  }

  function buildBreakdowns() {
    const wrap = document.getElementById('breakdowns');
    wrap.replaceChildren(); wrap.hidden = !D.breakdowns.length;
    D.breakdowns.forEach((b, i) => {
      const card = document.createElement('div'); card.className = 'card';
      const h = document.createElement('h3'); const sp = document.createElement('span'); sp.textContent = b.title[lang];
      const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'info'; btn.textContent = 'i'; btn.dataset.bd = String(i);
      h.append(sp, btn);
      const note = document.createElement('p'); note.className = 'note'; note.textContent = b.note[lang];
      const ch = document.createElement('div'); ch.className = 'chart'; ch.id = 'c-bd-' + i;
      card.append(h, note, ch); wrap.appendChild(card); bindInfo(btn);
    });
  }
  function drawBreakdowns() {
    D.breakdowns.forEach((b, i) => {
      const tot = b.rows.reduce((a, r) => a + r.n, 0);
      hbars(document.getElementById('c-bd-' + i), b.rows, { label: (r) => r.label[lang], value: (r) => r.n, end: (r) => `${N(r.n)} · ${P(r.n / tot)}`,
        color: (r, j) => VIVID[j % VIVID.length], tip: (r) => [`${N(r.n)} ${t('t_people')}`, P1(r.n / tot)] });
    });
  }
  const drawAll = () => { if (!D) return; drawVolume(); drawHeat(); drawClosed(); drawWeekday(); if (D.campaigns) drawCamp(); drawBreakdowns(); drawSpan(); drawGeo(); };

  // ---------- text + language ----------
  function renderText() {
    const v = V();
    document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en-US';
    document.title = (lang === 'pt' ? 'Atendimento por IA · ' : 'AI Reception · ') + D.client.name + ' | Albatroz Studio';
    document.getElementById('camp-card').hidden = !D.campaigns;
    buildBreakdowns();
    for (const n of document.querySelectorAll('[data-i18n]')) { const x = T[lang][n.dataset.i18n]; if (x !== undefined) n.textContent = typeof x === 'function' ? x(v) : x; }
    for (const b of document.querySelectorAll('.info')) b.setAttribute('aria-label', lang === 'pt' ? 'Como calculamos' : 'How we calculated this');
    for (const b of document.querySelectorAll('.lang button')) b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
  }
  function setLang(l, remember) {
    lang = l; closePop();
    if (remember) { try { localStorage.setItem('alb-lang-pref', l === 'pt' ? 'pt-br' : 'en'); } catch (e) {} }
    if (D) { renderText(); drawAll(); }
  }
  for (const b of document.querySelectorAll('.lang button')) b.addEventListener('click', () => setLang(b.dataset.lang, true));
  for (const b of document.querySelectorAll('.seg button')) b.addEventListener('click', () => {
    gran = b.dataset.gran;
    for (const o of document.querySelectorAll('.seg button')) o.setAttribute('aria-pressed', String(o === b));
    drawVolume();
  });

  // ---------- info popovers ----------
  const pop = document.getElementById('pop'); let popFor = null, pinned = false;
  function openPop(btn, pin) {
    const h = document.createElement('span'); h.className = 'pop-h'; h.textContent = lang === 'pt' ? 'Como calculamos' : 'How we calculated this';
    const p = document.createElement('span'); p.textContent = btn.dataset.bd !== undefined ? D.breakdowns[+btn.dataset.bd].tip[lang] : t(btn.dataset.tip, V());
    pop.replaceChildren(h, p); pop.hidden = false; popFor = btn; pinned = !!pin;
    for (const o of document.querySelectorAll('.info')) o.setAttribute('aria-expanded', String(o === btn));
    const r = btn.getBoundingClientRect(), pw = pop.offsetWidth, vw = document.documentElement.clientWidth;
    let x = r.left + window.scrollX + r.width / 2 - pw / 2;
    x = Math.max(window.scrollX + 12, Math.min(x, window.scrollX + vw - pw - 12));
    let y = r.bottom + window.scrollY + 10;
    if (r.bottom + pop.offsetHeight + 20 > window.innerHeight) y = r.top + window.scrollY - pop.offsetHeight - 10;
    pop.style.left = x + 'px'; pop.style.top = y + 'px';
  }
  function closePop() { pop.hidden = true; popFor = null; pinned = false; for (const o of document.querySelectorAll('.info')) o.setAttribute('aria-expanded', 'false'); }
  function bindInfo(b) {
    b.setAttribute('aria-expanded', 'false'); b.setAttribute('aria-describedby', 'pop');
    b.setAttribute('aria-label', lang === 'pt' ? 'Como calculamos' : 'How we calculated this');
    b.addEventListener('mouseenter', () => { if (!pinned) openPop(b, false); });
    b.addEventListener('mouseleave', () => { if (!pinned) closePop(); });
    b.addEventListener('focus', () => { if (!pinned) openPop(b, false); });
    b.addEventListener('blur', () => { if (!pinned) closePop(); });
    b.addEventListener('click', (e) => { e.stopPropagation(); if (popFor === b && pinned) closePop(); else openPop(b, true); });
  }
  for (const b of document.querySelectorAll('.info')) bindInfo(b);
  document.addEventListener('click', (e) => { if (pinned && !pop.contains(e.target)) closePop(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePop(); });

  // ---------- boot ----------
  const qs = new URLSearchParams(location.search).get('lang');
  let pref = null; try { pref = localStorage.getItem('alb-lang-pref'); } catch (e) {}
  lang = qs === 'en' || qs === 'pt' ? qs : pref ? (pref.startsWith('en') ? 'en' : 'pt') : (navigator.language || 'pt').toLowerCase().startsWith('pt') ? 'pt' : 'en';
  for (const b of document.querySelectorAll('.lang button')) b.setAttribute('aria-pressed', String(b.dataset.lang === lang));

  fetch('data.json').then((r) => r.json()).then((d) => {
    D = d; renderText(); drawAll();
    let last = 0;
    new ResizeObserver(() => { const w = document.getElementById('c-volume').clientWidth; if (Math.abs(w - last) > 4) { last = w; drawAll(); } }).observe(document.body);
  }).catch(() => {
    document.querySelector('.hero h1').textContent = lang === 'pt' ? 'Não foi possível carregar os dados.' : 'The data could not be loaded.';
  });
})();
</script>
</body>
</html>
